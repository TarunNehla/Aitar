services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    user: "1000:1000"
    # The host docker group, so the socket below is readable without root.
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Sandbox bind mounts are resolved by the host daemon, so the workspace
      # must live at the same absolute path inside and outside this container.
      - ${WORKSPACE_ROOT}:${WORKSPACE_ROOT}
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.cloud-agents.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.cloud-agents.entrypoints=websecure"
      - "traefik.http.routers.cloud-agents.tls.certresolver=letsencrypt"
      - "traefik.http.services.cloud-agents.loadbalancer.server.port=${PORT}"
      - "traefik.http.routers.cloud-agents-web.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.cloud-agents-web.entrypoints=web"
      - "traefik.http.routers.cloud-agents-web.middlewares=redirect-to-https@file"

networks:
  dokploy-network:
    external: true
